# Creates one GitHub release per supported Minecraft line (versions/*.properties), each with its own jar.
# Run it from the Actions tab ("Release" -> Run workflow). Releases that already exist are left alone.
name: Release
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'What changed (Markdown, shown on every release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - name: Build and test every Minecraft line
        run: |
          chmod +x ./gradlew
          mkdir -p dist
          for f in $(ls versions/*.properties | sort -V); do
            line=$(basename "$f" .properties)
            for i in 1 2 3; do ./gradlew clean build -Pmc=$line && break; sleep $((i * 30)); done
            cp build/libs/aureole-*+$line.jar dist/
          done
          ls -l dist
      - name: Create the releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          LOADER=$(grep '^loader_min=' gradle.properties | cut -d= -f2)
          LINES=$(ls versions/*.properties | xargs -n1 basename | sed 's/\.properties$//' | sort -V)
          NEWEST=$(echo "$LINES" | tail -1)
          for line in $LINES; do
            prop() { grep "^$1=" "versions/$line.properties" | cut -d= -f2; }
            GAMES=$(prop game_versions); API=$(prop fabric_api_version)
            FIRST=${GAMES%%,*}; LAST=${GAMES##*,}
            if [ "$FIRST" = "$LAST" ]; then MC="$FIRST"; else MC="$FIRST – $LAST"; fi
            TAG="v$VERSION+$line"
            JAR=$(ls dist/aureole-*+$line.jar)
            if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already exists, skipped"; continue; fi
            {
              echo "## Aureole $VERSION for Minecraft $MC"
              echo
              echo "**Works on:** Minecraft $(echo "$GAMES" | sed 's/,/, /g') with Fabric"
              echo
              echo "| Needs | Version |"
              echo "|---|---|"
              echo "| Fabric Loader | $LOADER or newer |"
              echo "| [Fabric API](https://modrinth.com/mod/fabric-api) | $API or newer |"
              echo "| [Mod Menu](https://modrinth.com/mod/modmenu) | optional |"
              echo
              echo "Download \`$(basename "$JAR")\` below and put it in your \`mods\` folder. Using another Minecraft version? Pick the release named after it."
              if [ -n "$CHANGELOG" ]; then echo; echo "### What's new"; echo; echo "$CHANGELOG"; fi
              echo
              echo "Purely cosmetic and client-side: nothing is sent to the server."
            } > notes.md
            LATEST=false; [ "$line" = "$NEWEST" ] && LATEST=true
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Aureole $VERSION for Minecraft $MC" --notes-file notes.md --latest=$LATEST
            echo "Created $TAG"
          done
